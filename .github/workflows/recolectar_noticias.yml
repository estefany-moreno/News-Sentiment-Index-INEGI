name: Recolectar Noticias

on:
  # GitHub Actions usa cron en UTC.
  # 08:01 AM Monterrey (UTC-6)  -> 14:01 UTC
  # 09:03 AM Monterrey (UTC-6)  -> 15:03 UTC, Actions tiene un retraso de 2.5 hrs o mayor para ejecutarse
  # 04:02 PM Monterrey (UTC-6)  -> 22:02 UTC
  # 05:17 PM Monterrey (UTC-6)  -> 23:17 UTC
  # 05:06 PM Monterrey (UTC-6)  -> 23:06 UTC
  # 10:30 PM Monterrey (UTC-6)  -> 04:30 UTC (día siguiente)
  # Si tu zona cambia por DST, ajusta estas horas.
  schedule:
    - cron: "7 12 * * *"
    - cron: "1 14 * * *"
    - cron: "3 15 * * *" 
    - cron: "7 19 * * *"
    - cron: "2 22 * * *"
    - cron: "17 23 * * *"
    - cron: "6 23 * * *"
  workflow_dispatch:

jobs:
  recolectar_noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear credentials.json
        run: |
          printf '%s' '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Ejecutar script de recolección unificada
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/credentials.json
          DATABURSATIL_TOKEN: ${{ secrets.DATABURSATIL_TOKEN }}
        run: python Recoleccion_Noticias.py

      - name: Mostrar resumen
        if: always()
        run: echo "Ejecución terminada"
